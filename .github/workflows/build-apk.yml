name: Build Kantin Kita APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Pure Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android Files
        run: node create-android-project.js

      - name: Build APK with Gradle
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../KantinKita-POS.apk

      - name: Upload APK ke GitHub Artifact (Download Langsung)
        uses: actions/upload-artifact@v4
        with:
          name: KantinKita-POS-APK
          path: KantinKita-POS.apk
          retention-days: 30
